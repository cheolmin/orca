name: Custom Windows Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'src/main/runtime/custom-mobile-relay-*.ts'
      - 'src/main/ipc/mobile.ts'
      - 'src/main/index.ts'
      - 'tools/mobile-reverse-relay*'
      - 'config/electron-builder.config.cjs'
      - '.github/workflows/custom-windows-build.yml'

permissions:
  contents: write

concurrency:
  group: custom-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test custom relay
        run: >-
          pnpm exec vitest run --config config/vitest.config.ts
          src/main/runtime/custom-mobile-relay-config.test.ts
          src/main/runtime/custom-mobile-relay-client.test.ts
          src/main/ipc/mobile.test.ts

      - name: Build desktop
        shell: pwsh
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          pnpm run build:desktop

      - name: Set custom version
        shell: pwsh
        run: |
          $base = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $suffix = 'custom.${{ github.run_number }}'
          $version = if ($base.Contains('-')) { "$base.$suffix" } else { "$base-$suffix" }
          "ORCA_LOCAL_BUILD_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package unsigned installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ORCA_PUBLISH_OWNER: cheolmin
        run: |
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never
          foreach ($asset in @(
            'dist/orca-windows-setup.exe',
            'dist/orca-windows-setup.exe.blockmap',
            'dist/latest.yml'
          )) {
            if (-not (Test-Path $asset)) {
              throw "Windows update asset was not produced: $asset"
            }
          }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: orca-windows-custom-${{ github.run_number }}
          path: |
            dist/orca-windows-setup.exe
            dist/orca-windows-setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish fork update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:ORCA_LOCAL_BUILD_VERSION"
          $assets = @(
            'dist/orca-windows-setup.exe',
            'dist/orca-windows-setup.exe.blockmap',
            'dist/latest.yml'
          )
          gh release create $tag @assets --title "Orca $env:ORCA_LOCAL_BUILD_VERSION" --notes 'Automated custom build with the embedded mobile reverse relay.' --latest
