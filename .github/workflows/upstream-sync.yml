name: Sync Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge upstream into a review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/stablyai/orca.git
          git fetch upstream --tags
          latest_release=$(git tag --list 'v[0-9]*' | grep -v '-' | sort -V | tail -1)
          if [ -n "$latest_release" ]; then
            git push origin "refs/tags/$latest_release"
          else
            echo "No stable upstream release tag found."
            exit 1
          fi
          git switch -C automation/upstream-sync origin/main
          git merge --no-edit "$latest_release"
          if git diff --quiet origin/main...HEAD; then
            echo "Already current with upstream."
            exit 0
          fi
          git push --force-with-lease origin HEAD
          if gh pr view automation/upstream-sync --json number --jq .number >/dev/null 2>&1; then
            gh pr edit automation/upstream-sync \
              --title "Sync upstream Orca $latest_release" \
              --body "Automated stable-release merge. Merge only after custom relay checks pass."
          else
            gh pr create \
              --base main \
              --head automation/upstream-sync \
              --title "Sync upstream Orca $latest_release" \
              --body "Automated stable-release merge. Merge only after custom relay checks pass."
          fi
